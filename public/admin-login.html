<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Badge System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-btn:hover {
            background: #2980b9;
        }
        
        .login-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success-message {
            background: #efe;
            color: #363;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .demo-credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
        
        .demo-credentials strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎯 Badge Admin</h1>
            <p>Sign in to access the dashboard</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    placeholder="Enter admin username"
                    value="admin"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="Enter admin password"
                    value="admin123"
                >
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>admin123</code>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/admin/auth';
        
        // Get redirect URL from query parameters or default to dashboard
        function getRedirectUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            
            // Validate redirect URL to prevent open redirects
            const allowedPaths = [
                '/admin-dashboard.html',
                '/user-management.html', 
                '/badge-management.html',
                '/admin-dashboard',
                '/user-management',
                '/badge-management'
            ];
            
            if (redirect && allowedPaths.some(path => redirect.startsWith(path))) {
                return redirect;
            }
            
            // Default to dashboard
            return '/admin-dashboard.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            
            try {
                console.log('🔐 Attempting login for user:', username);
                
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                console.log('📡 Login response:', result);
                
                if (result.success && result.token) {
                    // Store token and user info
                    localStorage.setItem('adminToken', result.token);
                    localStorage.setItem('adminUser', JSON.stringify(result.user));
                    
                    console.log('✅ Login successful, token stored:', result.token.substring(0, 20) + '...');
                    console.log('👤 User info stored:', result.user);
                    
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    
                    // Get the redirect URL
                    const redirectUrl = getRedirectUrl();
                    console.log('🔄 Redirecting to:', redirectUrl);
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                    
                } else {
                    const errorMsg = result.error || 'Login failed';
                    console.error('❌ Login failed:', errorMsg);
                    errorDiv.textContent = errorMsg;
                    errorDiv.style.display = 'block';
                }
                
            } catch (error) {
                console.error('❌ Network error:', error);
                errorDiv.textContent = 'Network error. Please check if the server is running.';
                errorDiv.style.display = 'block';
            } finally {
                // Reset button
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
        
        // Enhanced token verification with better error handling
        async function verifyToken(token) {
            try {
                console.log('🔄 Verifying token...');
                const response = await fetch(`${API_BASE_URL}/verify`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.json();
                console.log('✅ Token verification result:', result);
                return result;
                
            } catch (error) {
                console.error('❌ Token verification failed:', error);
                return { success: false, error: error.message };
            }
        }
        
        // Check if already logged in
        window.addEventListener('load', async () => {
            const token = localStorage.getItem('adminToken');
            const user = localStorage.getItem('adminUser');
            
            console.log('🔍 Checking existing authentication:', { 
                hasToken: !!token, 
                hasUser: !!user,
                currentUrl: window.location.href
            });
            
            if (token && user) {
                try {
                    const result = await verifyToken(token);
                    
                    if (result.success) {
                        // Already logged in, redirect to appropriate page
                        const redirectUrl = getRedirectUrl();
                        console.log('✅ Already authenticated, redirecting to:', redirectUrl);
                        
                        // Small delay to show the login page briefly
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 500);
                    } else {
                        // Token invalid, clear storage
                        console.log('❌ Token invalid, clearing storage');
                        localStorage.removeItem('adminToken');
                        localStorage.removeItem('adminUser');
                    }
                } catch (error) {
                    console.error('❌ Error during token verification:', error);
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminUser');
                }
            } else {
                console.log('🔐 No existing authentication found');
            }
        });

        // Add some debug info to help troubleshooting
        console.log('=== LOGIN PAGE DEBUG INFO ===');
        console.log('Current URL:', window.location.href);
        console.log('URL Search Params:', new URLSearchParams(window.location.search).toString());
        console.log('Redirect target:', getRedirectUrl());
        console.log('LocalStorage adminToken:', localStorage.getItem('adminToken') ? 'Present' : 'Missing');
        console.log('LocalStorage adminUser:', localStorage.getItem('adminUser') ? 'Present' : 'Missing');
        console.log('============================');
    </script>
</body>
</html>
